<header class="top"><div class="title-row"><h1><span id="title">ジャポニスム 前と後</span><small id="subtitle">分類でたどる年表</small></h1><nav class="links"><a id="to3d" href="index.html?lang=ja&view=lanes">3Dの宇宙へ ↗</a><a id="toCards" href="timeline.html?lang=ja">カード式で読む</a><div class="languages"><button id="ja" aria-pressed="true">日本語</button><button id="en" aria-pressed="false">English</button></div></nav></div><p class="guide" id="guide"></p>

<script src="data/japonisme-data.js"></script><script src="data/history-model.js"></script><script src="data/content.js"></script><script>
(()=>{'use strict';
const C=JaponismeContent,M=HistoryModel,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lanes=['outer','inner','source','bridge','artist','style','changes'],colors={outer:'#eda283',inner:'#eeb3cd',source:'#ecc46f',bridge:'#a8ccbb',artist:'#b7cae8',style:'#cdb3ec',motif:'#96cbdc',changes:'#d0c49b'},edgeColors={infl:'#a5bbc8',tie:'#e6b37c',force:'#ed899d',motif:'#83b9d3',witness:'#8bcda8',hypo:'#d7a0cf',frame:'#baa5d0'};
const periods=[['all',null,null,'全時代','All dates'],['early',900,1853,'900–1853 前史・交易','900–1853 · Early exchange'],['japonisme',1854,1914,'1854–1914 開国から還流','1854–1914 · Opening & return'],['modern',1915,2026,'1915–2026 戦後へ','1915–2026 · Later exchange']];
const url=new URL(location.href);let lang='ja';try{lang=url.searchParams.get('lang')||localStorage.getItem('japonisme-language')||'ja';}catch{}if(lang!=='en')lang='ja';
let period=periods.some(p=>p[0]===url.searchParams.get('era'))?url.searchParams.get('era'):'all',story=DATA.STORIES.some(s=>s.id===url.searchParams.get('story'))?url.searchParams.get('story'):'all',selected=null,nearby=false,shown=[],shownIds=new Set(),frame=0;
const regions=new Set((url.searchParams.get('regions')||'').split(',').filter(r=>M.regions[r]));const t=(ja,en)=>lang==='en'?en:ja,tr=s=>C.translate(s,lang);
const adjacency=new Map(C.nodes.map(n=>[n.id,[]]));for(const l of C.links){adjacency.get(l.a)?.push(l);if(l.b!==l.a)adjacency.get(l.b)?.push(l);}
const recordPlace=n=>n.year==null?n.place:M.placeAt(n,n.year,'history')||n.place,recordRegion=n=>M.placeRegions[recordPlace(n)]||'',regionKeys=[...new Set(C.nodes.map(recordRegion).filter(Boolean))];
const changes=new Set([...Object.keys(C.CAUSES),'english','akiko','soseki','imperial','bushido','tenshin']);
const motifs=C.nodes.filter(n=>n.kind==='motif');
function laneLabel(kind){return kind==='outer'?t('外部環境','External context'):kind==='changes'?t('日本で起きた変化','Changes in Japan'):tr(DATA.TYPES[kind]?.name||kind);}
function interpreted(link){return ['hypo','frame'].includes(link.kind)||/読み解き|解釈|仮説/.test(link.reason);}
function gazeBadge(id,explain=false){if(!['bigot','loti'].includes(id))return '';return `<span class="gaze-badge">${t('海外のまなざし','Views from abroad')}</span>${explain?`<p class="gaze-note">${t('海外の表現に現れる日本像を読む項目です。軍事・外交上の強制とは区別します。「読み解き」と記された関係線は作者の解釈であり、直接の因果関係を確認したものではありません。','This record concerns images of Japan in overseas representations, distinguished from military or diplomatic coercion. Links labeled as interpretations are the author’s reading, not verified direct causes.')}</p>`:''}`;}
function changeHTML(n){const c=C.CAUSES[n.id],meaning=C.meaningFor(n,lang);return `<button class="change-note" data-change="${n.id}" aria-label="${esc(t('日本で起きた変化：','Changes in Japan: ')+tr(n.name))}"><small>${c?t('以後の変化 · 起点 '+n.year+'年','Later change · trigger '+n.year):t('行動・表現・発信の変化','Action, expression & communication')}</small><span class="change-copy">${esc(c?c[lang][2]:meaning.text)}</span><em>${t('元の説明から整理した解説','Commentary based on the existing description')}<br>${esc(tr(n.name))} ↗</em></button>`;}
function patternsFor(id){return (adjacency.get(id)||[]).map(l=>({link:l,node:C.byId.get(l.a===id?l.b:l.a)})).filter(x=>x.node?.kind==='motif');}
function patternHTML(n,expanded=false){const relations=(adjacency.get(n.id)||[]).map(l=>({l,n:C.byId.get(l.a===n.id?l.b:l.a)})).filter(x=>x.n&&x.n.kind!=='motif');return `<details class="pattern-note" data-pattern-note="${n.id}" ${expanded?'open':''}><summary>${esc(tr(n.name))}</summary><p>${esc(tr(n.description))}</p><p class="pattern-meta">${esc(tr(n.subtitle))} · ${t('年代を割り当てない比較・読み解き','Undated comparison / interpretation')}</p>${n.note?`<p class="pattern-meta">${esc(tr(n.note))}</p>`:''}<div>${relations.map(x=>`<button data-target="${x.n.id}">${esc(tr(x.n.name))} · ${x.n.year??''}</button>`).join('')}</div></details>`;}
function patternSupplement(id){const rows=patternsFor(id);if(!rows.length)return '';return `<section class="pattern-supplement"><h3>${t('関連する共通の型','Related shared patterns')} · ${rows.length}</h3><p>${t('作品や出来事を比較するための読み解きです。特定の年に誕生したという意味ではありません。','These are interpretations for comparing records, not claims that a pattern began in a particular year.')}</p>${rows.map(x=>patternHTML(x.node)).join('')}</section>`;}
function openPatterns(id){$('patternTitle').textContent=t('共通の型を読む','Read shared patterns')+' · '+motifs.length;$('patternIntro').textContent=t('形・姿勢・広がり方を比較するための補足です。年代の絞り込みに左右されず読めます。関連する作品や出来事から年表へ戻れます。','Context for comparing forms, approaches and ways ideas spread. These notes remain available under date filters. Follow related records back to the timeline.');$('patternList').innerHTML=motifs.map(n=>patternHTML(n,n.id===id)).join('');if(!$('patternDialog').open)$('patternDialog').showModal();const focus=id?$('patternList').querySelector(`[data-pattern-note="${id}"]`):null;if(focus){focus.classList.add('focused');focus.scrollIntoView({block:'start',behavior:'instant'});try{history.replaceState(null,'','#record-'+encodeURIComponent(id));}catch{}}else $('patternDialog').scrollTop=0;}
function placeText(n){const p=recordPlace(n);return p==='edo'?(n.year<1868?t('江戸','Edo'):t('東京','Tokyo')):tr(C.places[p]?.[0]||p||'');}
function groupText(n){if(n.year==null)return '';const g=M.groupForPlace(recordPlace(n),n.year);return g?(lang==='en'?g.en:g.name):'';}
function connectedIds(id){const ids=new Set([id]);for(const l of adjacency.get(id)||[])ids.add(l.a===id?l.b:l.a);return ids;}
function baseVisible(){const p=periods.find(p=>p[0]===period),s=DATA.STORIES.find(s=>s.id===story),storyIds=s?new Set(s.chapters.flatMap(ch=>ch.ids)):null;return C.nodes.filter(n=>n.kind!=='motif'&&(period==='all'||period==='undated'&&n.year==null||p[1]!=null&&n.year!=null&&n.year>=p[1]&&n.year<=p[2])&&(!regions.size||regions.has(recordRegion(n)))&&(!storyIds||storyIds.has(n.id)));}
function save(){try{const u=new URL(location.href);u.searchParams.set('lang',lang);for(const [key,value]of [['era',period==='all'?'':period],['story',story==='all'?'':story],['regions',[...regions].join(',')]])value?u.searchParams.set(key,value):u.searchParams.delete(key);u.hash=selected?'record-'+encodeURIComponent(selected):'';history.replaceState(null,'',u);localStorage.setItem('japonisme-language',lang);}catch{}}
function syncText(){document.documentElement.lang=lang;document.title=t('ジャポニスム｜分類でたどる年表','Japonisme | Connections through time');$('title').textContent=t('ジャポニスム 前と後','Japonisme, Before & After');$('subtitle').textContent=t('分類でたどる年表','CONNECTIONS THROUGH TIME');$('guide').textContent=t('何が起きた → 誰がどう動いた → 日本で何が変わった。年代と役割から、つながりを読みます。','What happened → who responded → what changed in Japan. Read connections through dates and roles.');$('periodLabel').textContent=t('年代','Dates');$('storyLabel').textContent=t('物語','Story');$('to3d').textContent=t('3Dの宇宙へ ↗','Explore in 3D ↗');$('to3d').href='index.html?lang='+lang+'&view=lanes'+(selected?'&node='+encodeURIComponent(selected):'');$('toCards').textContent=t('カード式で読む','Read as cards');$('toCards').href='timeline.html?lang='+lang+(selected?'#record-'+encodeURIComponent(selected):'');$('creditsLink').textContent=t('図版の出典','Image sources');$('period').innerHTML=periods.map(p=>`<option value="${p[0]}">${esc(t(p[3],p[4]))}</option>`).join('');$('period').value=period;$('story').innerHTML=`<option value="all">${t('すべての物語','All stories')}</option>`+DATA.STORIES.map(s=>`<option value="${s.id}">${esc(tr(s.t))}</option>`).join('');$('story').value=story;
 $('regionLabel').textContent=t('国・地域','Regions')+(regions.size?' · '+regions.size:'')+' ▾';$('allRegions').textContent=t('全地域','All regions');$('jpFr').textContent=t('日本＋フランス','Japan + France');$('regionNote').textContent=t('地理的な地域で絞ります。各項目には、その記録の年代の国・地域名と活動場所を表示します。','Filters use geographic regions. Records show historical names and their recorded activity locations.');$('regionList').innerHTML=regionKeys.map(id=>`<label><input type="checkbox" value="${id}" ${regions.has(id)?'checked':''}>${esc(lang==='en'?M.regions[id].en:M.regions[id].name)}</label>`).join('');$('nearby').textContent=t('選択とつながりだけ','Selected + connections');$('nearby').disabled=!selected;$('nearby').setAttribute('aria-pressed',String(nearby));$('reset').textContent=t('表示を戻す','Reset view');$('laneJump').setAttribute('aria-label',t('列へ移動','Jump to a column'));$('laneJump').innerHTML=`<option value="">${t('列へ移動…','Go to column…')}</option>`+lanes.map(k=>`<option value="${k}">${esc(laneLabel(k))}</option>`).join('');$('patternsButton').textContent=t('共通の型','Shared patterns')+' · '+motifs.length;$('helpTitle').textContent=t('外部環境・内圧・変化の読み方','Reading context, pressures and change');$('helpCopy').textContent=t('「外部環境」は戦争・条約・海外市場などの条件と、海外のまなざしを分けて読みます。圧力は誰にとってかで変わります。右端は日本側の社会・表現・海外への発信の変化を、元の説明から整理した解説です。「以後の変化」は起点の年の後も含み、同年に起きたという意味ではありません。線のすべてが因果ではなく、作者の読み解きは明記します。共通の型は関連項目の補足で読めます。年の間隔は一定ではなく、人物の年は出生年とは限りません。','External context includes conditions such as war, treaties and markets, with views from abroad labeled separately. Pressure depends on perspective. The last column summarizes changes in Japanese society, expression and communication from existing descriptions. Later changes may follow the trigger year, not occur in that same year. Not every link is causal; interpretations are labeled. Shared patterns appear as contextual notes. Date spacing is unequal; dates for people are not necessarily birth dates.');$('ja').setAttribute('aria-pressed',String(lang==='ja'));$('en').setAttribute('aria-pressed',String(lang==='en'));
 $('legend').innerHTML=Object.entries(DATA.LT).map(([key,value])=>`<span><i class="${['hypo','frame','motif'].includes(key)?'dashed':''}" style="--stroke:${edgeColors[key]}"></i>${esc(tr(value.name))}</span>`).join('');}
function nodeHTML(n){const image=C.imageMap[n.id],mark=C.IMPACTS[n.id],place=[groupText(n),placeText(n)].filter(Boolean).join(' · ');return `<button class="node" data-node="${esc(n.id)}" data-kind="${n.kind}" style="--color:${colors[n.kind]}" aria-pressed="${n.id===selected}" aria-label="${esc(n.year+' · '+tr(n.name)+' · '+place)}" title="${esc(tr(n.name))}">${gazeBadge(n.id)}${image?`<img src="${esc(image.thumbnail)}" loading="lazy" decoding="async" width="33" height="42" alt="">`:''}<strong>${mark?`<span class="impact">${mark.icon}</span>`:''}${esc(tr(n.name))}</strong><span class="node-place">${esc(place||t('場所の指定なし','No specified place'))}</span><span class="connection-count">${(adjacency.get(n.id)||[]).length} ${t('つながり','connections')}${patternsFor(n.id).length?' · '+t('型','patterns')+' '+patternsFor(n.id).length:''}</span></button>`;}
function render(keepScroll=false){const top=$('viewport').scrollTop,left=$('viewport').scrollLeft;shown=baseVisible();if(selected&&!shown.some(n=>n.id===selected)){selected=null;nearby=false;}if(nearby&&selected){const ids=connectedIds(selected);shown=shown.filter(n=>ids.has(n.id));}shown.sort((a,b)=>a.year-b.year||a.id.localeCompare(b.id));shownIds=new Set(shown.map(n=>n.id));syncText();const counts=Object.fromEntries(lanes.map(k=>[k,k==='changes'?shown.filter(n=>changes.has(n.id)).length:shown.filter(n=>n.kind===k).length]));$('laneHead').innerHTML=`<div class="axis-title">${t('年代 ↓','Year ↓')}</div>`+lanes.map(k=>`<div data-column="${k}" style="--color:${colors[k]}">${esc(laneLabel(k))}<small>${counts[k]} ${k==='changes'?t('解説 · 以後の変化を含む','notes · includes later changes'):t('項目','records')}</small></div>`).join('');
 const years=[...new Set(shown.map(n=>n.year))];$('yearRows').innerHTML=years.map(year=>`<section class="year-row" data-year="${year}" aria-label="${year}"><div class="year-label"><span>${year}</span></div>${lanes.map(k=>`<div class="lane-cell" data-lane="${k}" style="--tint:${colors[k]}08">${shown.filter(n=>n.year===year&&(k==='changes'?changes.has(n.id):n.kind===k)).map(n=>k==='changes'?changeHTML(n):nodeHTML(n)).join('')}</div>`).join('')}</section>`).join('');$('rows').querySelector('.empty')?.remove();if(!shown.length)$('rows').insertAdjacentHTML('beforeend',`<p class="empty">${t('この条件に合う年代付きの項目はありません。「共通の型」は上のボタンから読めます。','No dated records match these filters. Shared patterns remain available from the button above.')}</p>`);
 updateSelection();status();save();if(keepScroll){$('viewport').scrollTop=top;$('viewport').scrollLeft=left;}else $('viewport').scrollTop=0;scheduleDraw();}
function status(){const s=DATA.STORIES.find(s=>s.id===story);$('status').textContent=`${shown.length} / ${C.nodes.length-motifs.length} ${t('年代付きの項目','dated records')} · ${t('型は補足で読む','Patterns available as notes')}${s?' · '+tr(s.t):''}`;}
function updateSelection(){const neighbors=selected?connectedIds(selected):new Set();$('board').classList.toggle('has-selected',!!selected);for(const e of $('yearRows').querySelectorAll('[data-node]')){e.classList.toggle('selected',e.dataset.node===selected);e.classList.toggle('related',e.dataset.node!==selected&&neighbors.has(e.dataset.node));e.setAttribute('aria-pressed',String(e.dataset.node===selected));}for(const e of $('yearRows').querySelectorAll('[data-change]'))e.classList.toggle('selected',e.dataset.change===selected);$('inspector').hidden=!selected;if(selected)detailHTML(C.byId.get(selected));$('nearby').disabled=!selected;$('nearby').setAttribute('aria-pressed',String(nearby));}
function scheduleDraw(){cancelAnimationFrame(frame);frame=requestAnimationFrame(drawEdges);}
function drawEdges(){const parent=$('rows').getBoundingClientRect(),positions=new Map();for(const element of $('yearRows').querySelectorAll('[data-node]')){const r=element.getBoundingClientRect();positions.set(element.dataset.node,{x:r.left-parent.left+r.width/2,y:r.top-parent.top+r.height/2,w:r.width,h:r.height});}const width=$('rows').clientWidth,height=Math.max(300,$('yearRows').offsetHeight);$('edges').setAttribute('width',width);$('edges').setAttribute('height',height);$('edges').setAttribute('viewBox',`0 0 ${width} ${height}`);const edges=C.links.filter(l=>positions.has(l.a)&&positions.has(l.b));$('edges').innerHTML=edges.map(l=>{const a=positions.get(l.a),b=positions.get(l.b),isReading=interpreted(l),same=Math.abs(a.x-b.x)<3,active=l.a===selected||l.b===selected;let d;if(same){const side=a.x+a.w/2-3,x=side+12;d=`M ${side},${a.y} C ${x},${a.y} ${x},${b.y} ${side},${b.y}`;}else{const right=b.x>a.x,x1=a.x+(right?1:-1)*a.w/2,x2=b.x-(right?1:-1)*b.w/2,middle=(x1+x2)/2;d=`M ${x1},${a.y} C ${middle},${a.y} ${middle},${b.y} ${x2},${b.y}`;}return `<path data-link="${l.id}" data-kind="${l.kind}" data-evidence="${isReading?'interpretation':'original'}" class="${selected?(active?'active':'muted'):''}" stroke="${isReading?edgeColors.hypo:edgeColors[l.kind]}" ${isReading||['hypo','frame','motif'].includes(l.kind)?'stroke-dasharray="5 5"':''} d="${d}"/>`;}).join('');}
function detailHTML(n){const meaning=C.meaningFor(n,lang),image=C.imageMap[n.id],cause=C.CAUSES[n.id],connections=(adjacency.get(n.id)||[]).filter(l=>C.byId.get(l.a===n.id?l.b:l.a)?.kind!=='motif'); $('detailKicker').textContent=laneLabel(n.kind)+' · '+(n.year??t('年代なし','Undated'));let html=`<h2>${esc(tr(n.name))}</h2>${gazeBadge(n.id,true)}<p class="meta">${n.year??t('年代なし','Undated')} · ${esc(groupText(n))}<br>${esc(placeText(n))}</p><div class="meaning"><small>${esc(meaning.label)}</small><p>${esc(meaning.text)}</p></div><div class="actions"><a href="index.html?node=${encodeURIComponent(n.id)}&lang=${lang}&view=lanes">${t('3Dで見る ↗','View in 3D ↗')}</a><a href="timeline.html?lang=${lang}#record-${encodeURIComponent(n.id)}">${t('カード式で読む','Read as a card')}</a></div><p class="description">${esc(tr(n.description))}</p>${n.note?`<p class="note">${esc(tr(n.note))}</p>`:''}`;
 if(cause)html+=`<h3>${t('出来事・圧力 → 人の行動 → その後','Events / pressures → human response → outcome')}</h3>`+cause[lang].map((step,i)=>`<div class="cause"><small>${t(['きっかけ・圧力','誰がどう動いた？','何が変わった？'][i],['Trigger / pressure','Who acted, and how?','What changed?'][i])}</small><p>${esc(step)}</p></div>`).join('');
 if(image)html+=`<button class="detail-image" data-image="${n.id}"><img src="${esc(image.src)}" alt="${esc(tr(image.caption))}"><span>${t('図版を拡大・出典を見る','Enlarge image / view sources')}</span></button><p class="credit">${esc(tr(image.caption))}<br>${esc(image.credit)} · ${esc(image.license)}</p>`;
 const keys=[];if(M.profiles[n.id]?.source)keys.push(M.profiles[n.id].source);if(n.id==='chagall')keys.push('chagallChronology');if(C.bingCopy[n.id])keys.push('bingName','bingTrade');html+=`<div class="sources">${keys.filter(k=>M.sources[k]).map(k=>`<a href="${esc(M.sources[k][1])}" target="_blank" rel="noopener">${esc(lang==='en'?'Historical source: '+k:M.sources[k][0])} ↗</a>`).join('')}</div>`;
 html+=patternSupplement(n.id);html+=`<h3>${t('つながり','Connections')} · ${connections.length}</h3><div class="relation-list">`+connections.map(l=>{const other=C.byId.get(l.a===n.id?l.b:l.a);if(!other)return '';return `<button class="relation" data-target="${other.id}"><span>${esc(tr(other.name))}</span><small>${esc(tr(DATA.LT[l.kind]?.name||l.kind))} · ${esc(tr(l.reason))}</small>${interpreted(l)?`<em class="interpretation">${t('作者の読み解き／後世の見方','Interpretation / later perspective')}</em>`:''}${!shownIds.has(other.id)?`<em>${t('表示条件を広げて、この項目へ','Expand filters to show this record')}</em>`:''}</button>`;}).join('')+'</div>';$('detail').innerHTML=html;}
function reveal(id){const element=[...$('yearRows').querySelectorAll('[data-node]')].find(e=>e.dataset.node===id);if(!element)return;const view=$('viewport'),r=element.getBoundingClientRect(),v=view.getBoundingClientRect(),header=$('laneHead').offsetHeight,axis=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--axis'));view.scrollTo({left:Math.max(0,view.scrollLeft+r.left-v.left-axis-18),top:Math.max(0,view.scrollTop+r.top-v.top-header-20),behavior:'instant'});element.focus({preventScroll:true});}
function choose(id,jump=false){if(!C.byId.has(id))return;if(C.byId.get(id).kind==='motif'){openPatterns(id);return;}const wasShown=shownIds.has(id);if(!wasShown){period='all';story='all';regions.clear();nearby=false;selected=id;render(true);$('announcement').textContent=t('関連項目が見えるよう表示条件を解除しました。','Filters cleared to reveal the related record.');}else{selected=id;if(nearby)render(true);else{syncText();updateSelection();save();scheduleDraw();}}$('inspector').scrollTop=0;if(jump)requestAnimationFrame(()=>reveal(id));}
function clearSelection(){selected=null;const wasNearby=nearby;nearby=false;if(wasNearby)render(true);else{syncText();updateSelection();save();scheduleDraw();}}
function openImage(id){const m=C.imageMap[id];if(!m)return;$('imageTitle').textContent=tr(m.caption);$('fullImage').src=m.src;$('fullImage').alt=tr(m.caption);$('imageCredit').innerHTML=`<p>${esc(m.credit)} · ${esc(m.license)}</p><a href="${esc(m.source)}" target="_blank" rel="noopener">${t('原資料 ↗','Original source ↗')}</a><a href="${esc(m.license_url)}" target="_blank" rel="noopener">${t('ライセンス ↗','License ↗')}</a>${/^https:\/\//.test(m.context||'')?`<a href="${esc(m.context)}" target="_blank" rel="noopener">${t('関係・背景の出典 ↗','Context source ↗')}</a>`:''}`;$('imageDialog').showModal();}
function jumpColumn(kind){const head=$('laneHead').querySelector(`[data-column="${kind}"]`);if(!head)return;const view=$('viewport');view.scrollLeft=head.offsetLeft-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--axis'));const bounds=view.getBoundingClientRect(),top=bounds.top+$('laneHead').offsetHeight,items=[...$('yearRows').querySelectorAll(`[data-kind="${kind}"], [data-lane="${kind}"] [data-change]`)];if(items.some(e=>{const r=e.getBoundingClientRect();return r.bottom>top&&r.top<bounds.bottom;}))return;const next=items.find(e=>e.getBoundingClientRect().bottom>top)||items[0];if(next)view.scrollTop+=next.getBoundingClientRect().top-top-16;else $('announcement').textContent=t('この列には、現在の条件に合う項目がありません。','This column has no records matching the current filters.');}
document.addEventListener('click',e=>{const change=e.target.closest('[data-change]');if(change)choose(change.dataset.change);const pattern=e.target.closest('[data-pattern]');if(pattern)openPatterns(pattern.dataset.pattern);const node=e.target.closest('[data-node]'),target=e.target.closest('[data-target]'),image=e.target.closest('[data-image]');if(node)choose(node.dataset.node);if(target){if($('patternDialog').open)$('patternDialog').close();choose(target.dataset.target,true);}if(image)openImage(image.dataset.image);if(!$('regions').contains(e.target))$('regions').open=false;});
 $('period').onchange=e=>{period=e.target.value;render();};$('story').onchange=e=>{story=e.target.value;render();};$('regionList').onchange=e=>{if(e.target.type==='checkbox'){e.target.checked?regions.add(e.target.value):regions.delete(e.target.value);render(true);}};$('allRegions').onclick=()=>{regions.clear();render();$('regions').open=false;};$('jpFr').onclick=()=>{regions.clear();regions.add('jp');regions.add('fr');render();$('regions').open=false;};$('nearby').onclick=()=>{if(!selected)return;nearby=!nearby;render();requestAnimationFrame(()=>reveal(selected));};$('reset').onclick=()=>{selected=null;nearby=false;period='all';story='all';regions.clear();render();$('viewport').scrollLeft=0;};$('closeDetail').onclick=clearSelection;$('laneJump').onchange=e=>{const head=$('laneHead').querySelector(`[data-column="${e.target.value}"]`);if(head)$('viewport').scrollLeft=head.offsetLeft-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--axis'));};
$('patternsButton').onclick=()=>openPatterns();$('closePatterns').onclick=()=>$('patternDialog').close();$('patternDialog').addEventListener('close',save);$('laneJump').onchange=e=>jumpColumn(e.target.value);
for(const language of ['ja','en'])$(language).onclick=()=>{lang=language;render(true);if(selected)requestAnimationFrame(()=>reveal(selected));};$('closeImage').onclick=()=>$('imageDialog').close();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('imageDialog').open&&!$('patternDialog').open){$('regions').open=false;clearSelection();}});
new ResizeObserver(scheduleDraw).observe($('rows'));new ResizeObserver(()=>{document.documentElement.style.setProperty('--header',$('laneHead').offsetHeight+'px');scheduleDraw();}).observe($('laneHead'));document.fonts.ready.then(scheduleDraw);
function requestedNode(){try{return decodeURIComponent(location.hash.replace(/^#record-/,''));}catch{return '';}}
window.addEventListener('hashchange',()=>{const id=requestedNode();if(C.byId.has(id))choose(id,true);else clearSelection();});
const requested=requestedNode();render();if(C.byId.has(requested))choose(requested,true);
window.laneDiagnostics=()=>({lang,period,story,regions:[...regions],selected,nearby,patterns:motifs.length,changes:[...$('yearRows').querySelectorAll('[data-change]')].map(e=>e.dataset.change),shown:shown.map(n=>({id:n.id,kind:n.kind,year:n.year,place:recordPlace(n),region:recordRegion(n)})),edges:[...$('edges').querySelectorAll('path')].map(p=>({id:Number(p.dataset.link),kind:p.dataset.kind,active:p.classList.contains('active')}))});
})();</script></body></html>

<script>
(()=>{
'use strict';
const C=JaponismeContent,M=HistoryModel,$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=new URL(location.href);let lang='ja';try{lang=url.searchParams.get('lang')||localStorage.getItem('japonisme-language')||'ja';}catch{}if(lang!=='en')lang='ja';
let story=url.searchParams.get('story')||'all',chapters=[],highlightTimer;
const t=(ja,en)=>lang==='en'?en:ja,tr=s=>C.translate(s,lang);
const colors={outer:'#f3ad94',inner:'#f4bcd0',source:'#ecc46f',bridge:'#b8d5cb',artist:'#b8cae7',style:'#d5bdec',motif:'#a4d9e1'};
const adjacency=new Map(C.nodes.map(n=>[n.id,[]]));for(const l of C.links){adjacency.get(l.a)?.push(l);if(l.a!==l.b)adjacency.get(l.b)?.push(l);}
const gate='<svg class="gate" viewBox="0 0 64 68" aria-hidden="true"><path fill="currentColor" d="M2 5L32 9L62 5V12L32 17L2 12ZM8 22H56V28H8ZM13 15H20V66H12ZM44 15H51L52 66H44ZM28 16H36V24H28Z"/></svg>';
function mainChapters(){
 const bins=DATA.CHAPTERS.map(ch=>({...ch,records:[]})),undated={t:'共通の型',why:'',y0:null,y1:null,records:[]};
 const explicit=new Map();for(let i=0;i<bins.length;i++)for(const id of bins[i].ids)if(!explicit.has(id))explicit.set(id,i);
 const starts=bins.map((c,i)=>({i,year:c.y0})).sort((a,b)=>a.year-b.year||a.i-b.i);
 for(const n of C.nodes){if(n.year==null){undated.records.push(n);continue;}let index=explicit.get(n.id);if(index==null){index=starts[0].i;for(const start of starts)if(start.year<=n.year)index=start.i;}bins[index].records.push(n);}
 for(const c of [...bins,undated])c.records.sort((a,b)=>(a.year??Infinity)-(b.year??Infinity)||a.id.localeCompare(b.id));return [...bins,undated];
}
function visibleChapters(){const s=DATA.STORIES.find(s=>s.id===story);if(!s){story='all';return mainChapters();}return s.chapters.map(ch=>({...ch,records:ch.ids.map(id=>C.byId.get(id)).filter(Boolean).sort((a,b)=>(a.year??Infinity)-(b.year??Infinity))}));}
function place(n){if(n.place==='edo')return n.year<1868?t('江戸','Edo'):t('東京','Tokyo');return tr(C.places[n.place]?.[0]||n.place||'');}
function cardHTML(n,chapterIndex){
 const meaning=C.meaningFor(n,lang),meta=C.imageMap[n.id],connections=adjacency.get(n.id)||[],impact=C.IMPACTS[n.id],group=M.groupForPlace(n.place,n.year||2026),groupName=group?(lang==='en'?group.en:group.name):'';
 const image=meta?`<button class="thumbnail" data-image="${esc(n.id)}" aria-label="${esc(t('図版を拡大：','Enlarge illustration: ')+tr(n.name))}"><img loading="lazy" decoding="async" width="124" height="140" src="${esc(meta.thumbnail)}" alt="${esc(tr(meta.caption))}"><span>${t('図版・出典','Image & source')}</span></button>`:'';
 const date=n.year==null?t('年代なし','Undated'):`${n.year}<small>${t('年','')}</small>`;
 return `<article class="record" id="record-${esc(n.id)}-${chapterIndex}" data-record="${esc(n.id)}" tabindex="-1" style="--kind:${colors[n.kind]||colors.style}"><div class="record-top"><span class="date">${date}</span><span class="kind"><i></i>${esc(tr(DATA.TYPES[n.kind]?.name||n.kind))}</span></div><div class="summary-layout"><div><h3>${esc(tr(n.name))}</h3><p class="location">${esc(place(n))}${groupName?' · '+esc(groupName):''}</p>${impact?`<p class="impact">${impact.icon}${impact.badge||''} ${esc(t(impact.ja,impact.en))}</p>`:''}<p class="meaning-label">${esc(meaning.label)}</p><p class="meaning-text">${esc(meaning.text)}</p></div>${image}</div><div class="record-actions"><a class="button" href="index.html?node=${encodeURIComponent(n.id)}&lang=${lang}">${t('3Dで見る ↗','View in 3D ↗')}</a></div><details class="detail-copy"><summary>${t('詳しく読む','Read more')}</summary><p class="description">${esc(tr(n.description))}</p>${n.subtitle?`<p class="note">${esc(tr(n.subtitle))}</p>`:''}${n.note?`<p class="note">${esc(tr(n.note))}</p>`:''}${causeHTML(n.id)}${sourceHTML(n.id)}</details><details class="connection-details"><summary>${t('つながり','Connections')} <span class="record-count">(${connections.length})</span></summary><div class="connections" data-connections="${esc(n.id)}"></div></details></article>`;
}
function causeHTML(id){const cause=C.CAUSES[id];if(!cause)return '';return `<section class="cause"><h4>${t('出来事・圧力 → 人の行動 → その後','Events / pressures → human response → outcome')}</h4>${cause[lang].map(step=>`<p>${esc(step)}</p>`).join('')}</section>`;}
function sourceHTML(id){const keys=[];if(M.profiles[id]?.source)keys.push(M.profiles[id].source);if(id==='chagall')keys.push('chagallChronology');if(C.bingCopy[id])keys.push('bingName','bingTrade');return `<div class="sources">${keys.filter(k=>M.sources[k]).map(k=>`<a href="${esc(M.sources[k][1])}" target="_blank" rel="noopener">${esc(lang==='en'?'Historical source: '+k:M.sources[k][0])} ↗</a>`).join('')}</div>`;}
function saveURL(){try{const u=new URL(location.href);u.searchParams.set('lang',lang);if(story==='all')u.searchParams.delete('story');else u.searchParams.set('story',story);history.replaceState(null,'',u);localStorage.setItem('japonisme-language',lang);}catch{}}
function render(){
 chapters=visibleChapters();document.documentElement.lang=lang;document.title=t('ジャポニスム｜年表で読む','Japonisme | Read the timeline');$('compareLanes').href='timeline-lanes.html?lang='+lang;$('compareLanes').textContent=t('外圧・内圧などの分類で比べる ↗','Compare pressures, people and art across categories ↗');
 $('brand').textContent=t('ジャポニスム 前と後','Japonisme, Before & After');$('brand').href='index.html?lang='+lang;$('view3D').href='index.html?lang='+lang;$('view3D').textContent=t('← 3Dで見る','← Explore in 3D');
 $('heading').innerHTML=t('海を渡った美を、<br>年代からたどる。','Follow art across oceans,<br>one record at a time.');
 $('introduction').textContent=t('日本の美が海を渡り、世界の芸術や文化と出会い、日本へ帰ってくる。物語を選び、人物・作品・出来事の「つながり」から、その流れを読み進めます。','Japanese art crosses the sea, meets art and culture around the world, and returns in new forms. Choose a story and follow connections between people, works and events.');
 $('recordsLabel').textContent=t('人物・作品・出来事','people, works & events');$('imagesLabel').textContent=t('図版のある項目','illustrated records');$('totalCount').textContent=C.nodes.length;$('storyLabel').textContent=t('物語を選ぶ','Choose a story');$('chapterLabel').textContent=t('章へ移動','Jump to a chapter');
 $('storySelect').innerHTML=`<option value="all">${t('本筋・全項目','Main timeline · all records')}</option>`+DATA.STORIES.map(s=>`<option value="${esc(s.id)}">${esc(tr(s.t))}</option>`).join('');$('storySelect').value=story;
 $('chapterSelect').innerHTML=`<option value="">${t('章を選ぶ…','Select a chapter…')}</option>`+chapters.map((ch,i)=>`<option value="${i}">${i+1}. ${esc(tr(ch.t)||t('共通の型','Shared patterns'))}</option>`).join('');
 const current=DATA.STORIES.find(s=>s.id===story);$('storyIntro').textContent=current?tr(current.thesis):'';
 $('readingNote').textContent=story==='all'?t('章の期間は重なります。章に明示された項目を優先し、その他の項目は開始年を目安に配置しています。各項目の年は記録の年代で、人物の出生年とは限りません。','Chapter periods overlap. Explicit chapter membership takes priority; other records are placed by chapter start dates. Record dates are not necessarily birth dates.'):t('選んだ物語の項目を表示しています。表示外の項目への「つながり」は、本筋に切り替えて開きます。','Showing the selected story. Connections to other records open in the main timeline.');
 $('chapters').innerHTML=chapters.map((ch,i)=>`<section class="chapter" id="chapter-${i}"><header class="chapter-heading">${gate}<div><div class="chapter-meta">${ch.y0==null?t('年代を持たない読み解き','Timeless interpretations'):`${ch.y0}–${ch.y1}`} · ${ch.records.length}${t('項目',' records')}</div><h2>${ch.y0==null?t('共通の型','Shared patterns'):esc(tr(ch.t))}</h2><p class="why">${esc(tr(ch.why))}</p></div></header><div class="cards">${ch.records.map(n=>cardHTML(n,i)).join('')}</div></section>`).join('');
 $('footerNote').textContent=t('史実・通説・作者の読み解きの区別は、元の説明と関係線の分類を引き継いでいます。制作途中の作品です。','The original distinctions between evidence, widely repeated accounts and interpretation are retained. This project is a work in progress.');
 $('creditLink').textContent=t('クレジット','Credits');$('imageCreditLink').textContent=t('図版の出典','Image sources');$('licenseLink').textContent=t('利用条件','Terms of use');$('backTop').textContent=t('↑ ページの先頭へ','↑ Back to top');
 $('ja').setAttribute('aria-pressed',String(lang==='ja'));$('en').setAttribute('aria-pressed',String(lang==='en'));saveURL();
}
function jump(id,updateHash=true){
 if(!C.byId.has(id))return;let card=[...document.querySelectorAll('[data-record]')].find(e=>e.dataset.record===id);
 if(!card){story='all';render();card=[...document.querySelectorAll('[data-record]')].find(e=>e.dataset.record===id);}if(!card)return;
 document.querySelectorAll('.highlight').forEach(e=>e.classList.remove('highlight'));card.classList.add('highlight');card.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});card.focus({preventScroll:true});
 if(updateHash)try{history.replaceState(null,'','#record-'+encodeURIComponent(id));}catch{}$('announcement').textContent=tr(C.byId.get(id).name);clearTimeout(highlightTimer);highlightTimer=setTimeout(()=>card.classList.remove('highlight'),4500);
}
function openConnections(details){if(!details.open)return;const holder=details.querySelector('[data-connections]');if(holder.childElementCount)return;const id=holder.dataset.connections;holder.innerHTML=(adjacency.get(id)||[]).map(l=>{const other=C.byId.get(l.a===id?l.b:l.a);return other?`<button class="connection" data-jump="${esc(other.id)}"><strong>${esc(tr(other.name))}</strong><small>${esc(tr(DATA.LT[l.kind]?.name||l.kind))} · ${esc(tr(l.reason))}</small></button>`:'';}).join('');}
function openImage(id){const meta=C.imageMap[id];if(!meta)return;$('imageTitle').textContent=tr(meta.caption);$('fullImage').src=meta.src;$('fullImage').alt=tr(meta.caption);$('imageCredits').innerHTML=`<p>${esc(meta.credit)}</p><p>${esc(meta.license)}</p><div class="credits-links"><a href="${esc(meta.source)}" target="_blank" rel="noopener">${t('原資料 ↗','Original source ↗')}</a><a href="${esc(meta.license_url)}" target="_blank" rel="noopener">${t('ライセンス ↗','License ↗')}</a>${/^https:\/\//.test(meta.context||'')?`<a href="${esc(meta.context)}" target="_blank" rel="noopener">${t('関係・背景の出典 ↗','Context source ↗')}</a>`:''}</div>`;$('imageDialog').showModal();}
function changeLanguage(next){const navBottom=$('navigation').getBoundingClientRect().bottom,visible=[...document.querySelectorAll('[data-record]')].find(e=>{const r=e.getBoundingClientRect();return r.bottom>navBottom&&r.top<innerHeight;}),id=visible?.dataset.record;lang=next;render();if(id)requestAnimationFrame(()=>jump(id,false));}
document.addEventListener('toggle',e=>{if(e.target.classList?.contains('connection-details'))openConnections(e.target);},true);
document.addEventListener('click',e=>{const jumpButton=e.target.closest('[data-jump]'),imageButton=e.target.closest('[data-image]');if(jumpButton)jump(jumpButton.dataset.jump);if(imageButton)openImage(imageButton.dataset.image);});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'){$('error').hidden=false;$('error').textContent=t('図版を読み込めませんでした。HTMLと同じ場所に data/ と images/ があるか確認してください。','An illustration could not be loaded. Keep data/ and images/ beside the HTML pages.');}},true);
const updateNavigation=()=>document.documentElement.style.setProperty('--nav-height',Math.ceil($('navigation').getBoundingClientRect().height)+'px');new ResizeObserver(updateNavigation).observe($('navigation'));
const requestedRecord=()=>{try{return decodeURIComponent(location.hash.replace(/^#record-/,''));}catch{return '';}};
window.addEventListener('hashchange',()=>jump(requestedRecord(),false));$('storySelect').onchange=e=>{story=e.target.value;try{history.replaceState(null,'',location.pathname+location.search);}catch{}render();$('reading').scrollIntoView({block:'start'});};$('chapterSelect').onchange=e=>{if(e.target.value!=='')$('chapter-'+e.target.value).scrollIntoView({block:'start'});};
 $('ja').onclick=()=>changeLanguage('ja');$('en').onclick=()=>changeLanguage('en');$('closeImage').onclick=()=>$('imageDialog').close();$('imageDialog').addEventListener('click',e=>{if(e.target===$('imageDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});$('backTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
render();updateNavigation();if(location.hash.startsWith('#record-'))requestAnimationFrame(()=>jump(requestedRecord(),false));
window.timelineDiagnostics=()=>({lang,story,records:[...document.querySelectorAll('[data-record]')].map(e=>e.dataset.record),chapters:chapters.map(ch=>({t:ch.t,ids:ch.records.map(n=>n.id)}))});
})();
</script>
</body>
</html>
